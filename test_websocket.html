<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .log {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #00ff00;
        }
        .error {
            color: #ff0000;
            border-left-color: #ff0000;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendPing()">Send Ping</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    <div id="logs"></div>

    <script>
        let ws = null;

        function log(message, isError = false) {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = isError ? 'log error' : 'log';
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function connect() {
            if (ws) {
                log('Already connected!', true);
                return;
            }

            log('Connecting to ws://localhost:8000/ws/logs...');
            ws = new WebSocket('ws://localhost:8000/ws/logs');

            ws.onopen = () => {
                log('✅ WebSocket connected successfully!');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`📨 Message received: ${JSON.stringify(data, null, 2)}`);
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error}`, true);
            };

            ws.onclose = () => {
                log('🔌 WebSocket disconnected');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('Disconnecting...');
            } else {
                log('Not connected!', true);
            }
        }

        function sendPing() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('ping');
                log('⚡ Sent ping');
            } else {
                log('WebSocket not connected!', true);
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        // Auto-connect on load
        window.addEventListener('DOMContentLoaded', connect);
    </script>
</body>
</html>
