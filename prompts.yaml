toc_parser:
  name: "Очистка и структурирование оглавления ТЗ"
  version: "1.2"
  model: "deepseek_chat"           # или какую используешь
  temperature: 0.7
  max_tokens: 4096
  system: |
    Ты — эксперт по разбору технических заданий на русском языке.
    У меня есть грязное оглавление из PDF (скопировано из таблицы).
    
    Задача:
    1. Очисти весь мусор (таблицы, инв.№, подписи и т.д.).
    2. Построй иерархическую структуру.
    3. Для каждого раздела укажи page_start (номер страницы начала).
    4. Верни ТОЛЬКО валидный JSON в таком формате:
    
    {
      "toc": [
        {
          "level": 1,
          "number": "1.",
          "title": "Общие положения",
          "page_start": 4,
          "children": []
        },
        {
          "level": 2,
          "number": "2.1.",
          "title": "Технические характеристики площадки компрессоров",
          "page_start": 6,
          "children": []
        },
        ...
      ]
    }
    
    Будь максимально точен с номерами страниц. Не добавляй ничего лишнего.

  user_template: |
    Вот грязное оглавление:
    ```
    {toc_text}
    ```
    
    Выполни задачу.

requirement_extractor:
  name: "Извлечение требований из раздела ТЗ"
  version: "1.3"
  model: "deepseek_chat"
  temperature: 0.7
  max_tokens: 8192               # обычно требования занимают много места
  system: |
    Ты — эксперт по извлечению требований из технических заданий.
    Извлеки ВСЕ требования из следующего раздела ТЗ.
    
    Раздел: {section['number']} {section['title']}
    Страницы: {section['page_start']}-{next_start if next_start else 'конец'}
    
    Текст раздела:
    {full_text[:12000]}  # обрезаем, если вдруг очень большой (DeepSeek выдержит)
    
    Верни ТОЛЬКО валидный JSON:
    {{
      "section": "{section['number']} {section['title']}",
      "page_range": "{section['page_start']}-{next_start if next_start else 'конец'}",
      "requirements": [
        {{
          "id": "REQ-{section['number'].replace('.', '')}-001",
          "text": "полный текст требования...",
          "type": "Техническое / Организационное / Документационное",
          "priority": "Обязательно / Желательно",
          "reference": "ГОСТ / ссылка из текста"
        }}
      ]
    }}

  user_template: |
    Раздел: {section_number} {section_title}
    Страницы: {page_range}
    
    Текст:
    ```
    {section_text}
    ```
    
    Извлеки все требования.
