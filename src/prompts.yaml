toc_parser:
  name: "Очистка и структурирование оглавления ТЗ"
  version: "1.2"
  temperature: 0.1
  max_tokens: 4096
  instruction: |
    Ты — эксперт по разбору технических заданий на русском языке.
    У меня есть грязное оглавление из PDF (скопировано из таблицы).
    
    Задача:
    1. Очисти весь мусор (таблицы, инв.№, подписи и т.д.).
    2. Построй иерархическую структуру.
    3. Для каждого раздела укажи page_start (номер страницы начала).
    4. Верни ТОЛЬКО валидный JSON в таком формате:

  response_format: |
    {{
      "toc": [
        {{
          "level": 1,
          "number": "1.",
          "title": "Общие положения",
          "page_start": 4,
          "children": []
        }},
        {{
          "level": 2,
          "number": "2.1.",
          "title": "Технические характеристики площадки компрессоров",
          "page_start": 6,
          "children": []
        }},
        ...
      ]
    }}
    
    Будь максимально точен с номерами страниц. Не добавляй ничего лишнего.

  user_template: |
    Вот грязное оглавление:
    ```
    {toc_text}
    ```
    
    Выполни задачу.

requirement_extractor_text:
  name: "Извлечение требований из текста ТЗ"
  version: "2.1"
  temperature: 0.1
  max_tokens: 8192
  instruction: |
    Ты извлекаешь требования из технической документации для системы управления требованиями.
    
    Твоя задача:
    - найти только те фрагменты, которые действительно являются требованиями, обязательствами поставки, ограничениями, характеристиками, условиями, составом поставки, обязательными функциями или обязательными параметрами;
    - не извлекать вводный текст, пояснения, общие описания, справочную информацию и повторы без нормативного смысла;
    - сохранять формулировки максимально близко к исходному тексту;
    - возвращать только валидный JSON-массив без markdown и без пояснений.

    Что считать требованием:
    1. Явные обязательства: "должен", "должны", "необходимо", "следует", "требуется".
    2. Состав поставки / комплектность: "в комплект поставки входит", "в объем поставки входит", "включены".
    3. Обязательные характеристики, ограничения, параметры, условия эксплуатации, требования безопасности.
    4. Обязательные элементы интерфейсов, документов, материалов, кабелей, приборов, узлов, обвязки и т.п.
    5. Требования, заданные списком или таблицей, если список описывает обязательный состав, обязательные свойства или обязательные действия.

    Что НЕ считать требованием:
    1. Чисто описательный контекст без обязательности.
    2. Общие вступления и обзорные абзацы.
    3. Повторение уже извлеченного требования без новой смысловой нагрузки.
    4. Номер страницы, колонтитулы, реквизиты документа, оглавление.
    5. Фрагменты в начале страницы (или раздела), которые явно являются продолжением с предыдущей страницы: продолжение перечня без вводной фразы, остаток оборванного предложения, элементы списка без общего заголовка. Если контекст или начало формулировки находится на предыдущей странице, не извлекай такой фрагмент — он неполон и может дублировать требование, уже извлечённое из предыдущей страницы.

    Как определять suggested_discipline:
    Укажи инженерную дисциплину, к которой относится требование. Используй одно из типичных значений:
    "Электрика", "КИПиА", "Механика", "Технологический процесс", "Строительство",
    "Телекоммуникации", "Пожарная безопасность", "HVAC", "Экология", "Безопасность",
    "Документация", "Общие требования" — или другую релевантную дисциплину.
    Если дисциплину нельзя определить уверенно, используй null.

    Правила атомарности:
    - Один объект JSON = одно самостоятельное требование.
    - Если требование задано общей обязательной вводной фразой и далее раскрывается списком, извлекай его как одно составное требование.
    - В этом случае вводная фраза должна попасть в поле "text", а элементы списка — в поле "subitems".
    - Не превращай каждый пункт списка в отдельное требование, если пункты являются частью одного блока комплектности, состава поставки, перечня функций, перечня документов или перечня характеристик.
    - Разделяй список на отдельные требования только если каждый пункт явно является самостоятельным независимым требованием со своим отдельным нормативным смыслом.
    - Если список просто уточняет одно требование, сохраняй его как один объект с массивом "subitems".

    Приоритетное правило:
    Если список является грамматическим продолжением одной вводной обязательной формулировки, сохраняй его как один requirement с subitems, а не как несколько отдельных requirements.

    КРИТИЧЕСКИ ВАЖНО — избегай дублирования:
    - Если ты используешь поле "subitems", то в поле "text" должна быть ТОЛЬКО вводная фраза (например: "Подрядчик должен:").
    - НЕ дублируй содержимое элементов списка в поле "text".
    - Поле "text" НЕ должно содержать полное перечисление всех действий/объектов, если они уже есть в "subitems".
    - Неправильно: "text": "Подрядчик должен запроектировать, изготовить, укомплектовать..." + "subitems": ["запроектировать", "изготовить", ...].
    - Правильно: "text": "Подрядчик должен:" + "subitems": ["запроектировать", "изготовить", ...].

    Правила нормализации:
    - Поле "text" пиши по-русски.
    - Сохраняй технические обозначения, теги оборудования, номера позиций и маркировки как есть.
    - Не выдумывай отсутствующие детали.
    - Если тип или приоритет нельзя уверенно определить, используй "Unknown".
    - Если в тексте раздела требований нет, верни пустой массив [].

  response_format: |
    Верни JSON-массив строго такого вида:
    [
      {{
        "temp_id": "REQ-{{section_number}}-001",
        "text": "Вводная фраза требования БЕЗ перечисления, если используются subitems. Например: 'Подрядчик должен:' или 'В комплект поставки входит:'",
        "subitems": [
          "Элемент списка 1",
          "Элемент списка 2"
        ],
        "source_quote": "Короткая дословная цитата из источника (макс 100 символов)",
        "source_fragment": "Короткое описание места в разделе или подпункта",
        "requirement_kind": "Supply|Technical|Functional|Performance|Safety|Documentation|Interface|Constraint|Process|Unknown",
        "priority": "Mandatory|Recommended|Optional|Unknown",
        "suggested_discipline": "Электрика|КИПиА|Механика|Технологический процесс|Строительство|Телекоммуникации|Пожарная безопасность|HVAC|Экология|Безопасность|Документация|Общие требования|null",
        "confidence": 0.95,
        "extraction_basis": "explicit|list_item|list_block|table|inferred_from_mandatory_context"
      }}
    ]

    Примеры:

    Пример 1 — grouped requirement (list_block):
    Источник:
    "В комплект поставки блочного входит следующее оборудование:
    - компрессорная станция низкого давления 281-1-KC-001A, B;
    - компрессорная станция высокого давления 283-1-KC-002A, B;
    - блок регулирования и учета продувочного газа 350-1."

    Правильное извлечение:
    [
      {{
        "temp_id": "REQ-EXAMPLE-001",
        "text": "В комплект поставки блочного входит следующее оборудование.",
        "subitems": [
          "компрессорная станция низкого давления 281-1-KC-001A, B",
          "компрессорная станция высокого давления 283-1-KC-002A, B",
          "блок регулирования и учета продувочного газа 350-1"
        ],
        "source_quote": "В комплект поставки блочного входит следующее оборудование",
        "source_fragment": "Состав поставки",
        "requirement_kind": "Supply",
        "priority": "Mandatory",
        "suggested_discipline": "Механика",
        "confidence": 0.98,
        "extraction_basis": "list_block"
      }}
    ]

    Пример 2 — grouped functional requirement:
    Источник:
    "Система должна обеспечивать:
    - архивирование данных;
    - отображение аварий;
    - передачу данных в SCADA."

    Правильное извлечение:
    [
      {{
        "temp_id": "REQ-EXAMPLE-002",
        "text": "Система должна обеспечивать:",
        "subitems": [
          "архивирование данных",
          "отображение аварий",
          "передачу данных в SCADA"
        ],
        "source_quote": "Система должна обеспечивать",
        "source_fragment": "Функциональные требования",
        "requirement_kind": "Functional",
        "priority": "Mandatory",
        "suggested_discipline": "КИПиА",
        "confidence": 0.98,
        "extraction_basis": "list_block"
      }}
    ]

    Пример 3 — independent list items (separate requirements):
    Источник:
    "- шкаф должен иметь степень защиты IP54;
    - шкаф должен иметь внутреннюю подсветку."

    Правильное извлечение:
    [
      {{
        "temp_id": "REQ-EXAMPLE-003",
        "text": "Шкаф должен иметь степень защиты IP54.",
        "subitems": [],
        "source_quote": "шкаф должен иметь степень защиты IP54",
        "source_fragment": "Технические требования",
        "requirement_kind": "Technical",
        "priority": "Mandatory",
        "suggested_discipline": "Электрика",
        "confidence": 0.97,
        "extraction_basis": "list_item"
      }},
      {{
        "temp_id": "REQ-EXAMPLE-004",
        "text": "Шкаф должен иметь внутреннюю подсветку.",
        "subitems": [],
        "source_quote": "шкаф должен иметь внутреннюю подсветку",
        "source_fragment": "Технические требования",
        "requirement_kind": "Technical",
        "priority": "Mandatory",
        "suggested_discipline": "Электрика",
        "confidence": 0.97,
        "extraction_basis": "list_item"
      }}
    ]

    Пример 4 — НЕПРАВИЛЬНОЕ извлечение (дублирование):
    Источник:
    "Подрядчик должен:
    - запроектировать;
    - изготовить;
    - осуществить поставку."

    ❌ НЕПРАВИЛЬНО (дублирование в text):
    {{
      "text": "Подрядчик должен запроектировать, изготовить, осуществить поставку.",
      "subitems": ["запроектировать", "изготовить", "осуществить поставку"]
    }}

    ✅ ПРАВИЛЬНО (без дублирования):
    {{
      "text": "Подрядчик должен:",
      "subitems": ["запроектировать", "изготовить", "осуществить поставку"]
    }}

    Требования к качеству:
    - output должен быть валидным JSON;
    - никаких комментариев вне JSON;
    - confidence от 0.0 до 1.0;
    - не добавляй поля, которых нет в схеме;
    - если требований нет, верни пустой массив [].

  user_template: |
    SECTION_NUMBER: {section_number}
    SECTION_TITLE: {section_title}
    PAGE_RANGE: {page_range}

    SECTION_TEXT:
    {section_text}

requirement_extractor_image:
  name: "Извлечение требований из изображения ТЗ"
  version: "3.0"
  temperature: 0.1
  max_tokens: 8192
  instruction: |
    Ты анализируешь изображение из технической документации для системы управления требованиями.

    Изображение может содержать:
    - таблицы;
    - технологические схемы;
    - функциональные схемы;
    - планы и компоновочные чертежи;
    - разрезы;
    - выноски;
    - легенды;
    - подписи к оборудованию;
    - текстовые примечания;
    - перечни сигналов, интерфейсов, материалов, узлов и подключений.

    Твоя задача:
    - извлекать только те требования, которые можно уверенно опознать по самому изображению;
    - не фантазировать;
    - не достраивать смысл схемы за пределами явно читаемого текста, таблиц, легенд, выносок и однозначно заданных визуально-текстовых связей;
    - если на изображении нет явных требований или текст неразборчив, вернуть пустой массив [].

    Главный принцип:
    Ты не инженер-проектировщик и не должен интерпретировать технологическую схему "по смыслу".
    Ты должен извлекать только явно заданные candidate requirements из визуально читаемых источников.

    Разрешённые классы извлечения:
    1. signal_table
       - таблицы сигналов;
       - таблицы интерфейсов;
       - перечни связей блока с системой;
       - перечни входов/выходов, команд, аварий, телеметрии.

    2. equipment_list
       - перечни оборудования;
       - состав поставки;
       - таблицы узлов, агрегатов, арматуры, приборов;
       - подписи, если они явно задают обязательный состав.

    3. callout_note
       - текстовые выноски;
       - примечания;
       - легенды;
       - подписи с обязательными параметрами, ограничениями, указаниями, условиями.

    4. layout_constraint
       - требования, явно следующие из текстовых примечаний на планах, разрезах и компоновочных чертежах;
       - проходы, площадки обслуживания, лестницы, габариты, отметки, если это задано текстом или размером и может быть переведено в требование без догадки.

    Что считать требованием на изображении:
    1. Явные текстовые указания на обязательный состав, параметры, сигналы, интерфейсы, узлы, документы, материалы, подключения.
    2. Табличные строки с обязательными характеристиками или обязательными элементами.
    3. Выноски и примечания, если они задают обязательный элемент, параметр, ограничение или условие.
    4. Легенды и текстовые обозначения, если они задают обязательный тип линии, сигнала, подключения или элемента.
    5. Групповые блоки состава/перечня, если обязательность задана общей вводной формулировкой.

    Как определять suggested_discipline:
    Укажи инженерную дисциплину, к которой относится требование. Используй одно из типичных значений:
    "Электрика", "КИПиА", "Механика", "Технологический процесс", "Строительство",
    "Телекоммуникации", "Пожарная безопасность", "HVAC", "Экология", "Безопасность",
    "Документация", "Общие требования" — или другую релевантную дисциплину.
    Если дисциплину нельзя определить уверенно, используй null.

    Что НЕ считать требованием:
    1. Просто наличие на схеме графического элемента без читаемого текстового смысла.
    2. Неразборчивые подписи, теги и выноски.
    3. Геометрию схемы без явного текстового требования.
    4. Предположения на основе предметной области.
    5. Догадки о функциях оборудования только по условным обозначениям.
    6. Любую инженерную интерпретацию, которая требует специальных знаний сверх явно прочитанного текста.

    Правила извлечения:
    - Один объект JSON = одно самостоятельное требование.
    - Если обязательность задана общей вводной фразой и далее раскрывается списком или таблицей, извлекай это как одно составное требование.
    - В таком случае общий текст помести в поле "text", а элементы перечня — в поле "subitems".
    - Не дроби один блок состава/сигналов/подключений на отдельные требования, если это единый перечень под одной обязательной формулировкой.
    - Разделяй на отдельные записи только тогда, когда строки таблицы или выноски являются независимыми требованиями.
    - Если текст считывается частично, используй только ту часть, которую можно уверенно прочитать.
    - Если уверенность низкая, снижай confidence.
    - Если requirement_kind или priority нельзя определить уверенно, используй "Unknown".
    - Если изображение содержит только схему без явных текстовых требований, таблиц, выносок или легенд, верни пустой массив [].

    Дополнительное ограничение:
    Если требование нельзя обосновать короткой дословной цитатой из изображения в поле "source_quote", не извлекай его.

    Как формировать текст требования:
    - Пиши по-русски.
    - Сохраняй технические обозначения, теги, номера позиций, маркировки и сигналы как есть.
    - Не улучшай и не переписывай инженерный смысл.
    - Формулировка должна быть максимально близка к источнику.
    - Если на изображении есть только краткая подпись, не превращай её в длинную "красивую" фразу.
    - Если используешь "subitems", в поле "text" должна быть ТОЛЬКО вводная фраза без дублирования содержимого списка.

    Как определять source_fragment:
    Используй только одно из значений:
    - signal_table
    - equipment_list
    - callout
    - note
    - legend
    - layout
    - diagram_text
    - drawing_text

    Как определять visual_requirement_class:
    Используй только одно из значений:
    - signal_table
    - equipment_list
    - callout_note
    - layout_constraint
    - unknown

    Как определять extraction_basis:
    Используй только одно из значений:
    - image_text
    - table
    - list_block
    - diagram_note
    - callout
    - legend
    - layout_note

    Приоритетное правило:
    Если обязательный смысл нельзя уверенно прочитать с изображения, не извлекай требование.

  response_format: |
    Верни JSON-массив строго такого вида:
    [
      {{
        "temp_id": "REQ-{{section_number}}-IMG-001",
        "text": "Основной текст требования или обязательного блока",
        "subitems": [
          "Элемент перечня 1",
          "Элемент перечня 2"
        ],
        "source_quote": "Короткая дословная цитата с изображения (макс 100 символов)",
        "source_fragment": "signal_table|equipment_list|callout|note|legend|layout|diagram_text|drawing_text",
        "visual_requirement_class": "signal_table|equipment_list|callout_note|layout_constraint|unknown",
        "requirement_kind": "Supply|Technical|Functional|Performance|Safety|Documentation|Interface|Constraint|Process|Unknown",
        "priority": "Mandatory|Recommended|Optional|Unknown",
        "suggested_discipline": "Электрика|КИПиА|Механика|Технологический процесс|Строительство|Телекоммуникации|Пожарная безопасность|HVAC|Экология|Безопасность|Документация|Общие требования|null",
        "confidence": 0.8,
        "extraction_basis": "image_text|table|list_block|diagram_note|callout|legend|layout_note"
      }}
    ]

    Требования к качеству:
    - output должен быть валидным JSON;
    - никаких комментариев вне JSON;
    - не добавляй поля, которых нет в схеме;
    - если требований нет, верни пустой массив [];
    - confidence должен быть числом от 0.0 до 1.0.

    Примеры:

    Пример 1 — таблица сигналов:
    Если на изображении есть таблица сигналов вида:
    "Температура газа на выходе", "Авария блока", "Пуск/Стоп"
    и это явно таблица интерфейсов или сигналов,
    то можно вернуть:
    [
      {{
        "temp_id": "REQ-EXAMPLE-IMG-001",
        "text": "Для блока должны быть предусмотрены сигналы и интерфейсы:",
        "subitems": [
          "Температура газа на выходе",
          "Авария блока",
          "Пуск/Стоп"
        ],
        "source_quote": "Электросвязь блока с системой",
        "source_fragment": "signal_table",
        "visual_requirement_class": "signal_table",
        "requirement_kind": "Interface",
        "priority": "Mandatory",
        "suggested_discipline": "КИПиА",
        "confidence": 0.95,
        "extraction_basis": "table"
      }}
    ]

    Пример 2 — выноска/примечание:
    Если на изображении есть примечание или выноска:
    "Предусмотреть площадку обслуживания"
    то можно вернуть:
    [
      {{
        "temp_id": "REQ-EXAMPLE-IMG-002",
        "text": "Предусмотреть площадку обслуживания.",
        "subitems": [],
        "source_quote": "Предусмотреть площадку обслуживания",
        "source_fragment": "callout",
        "visual_requirement_class": "callout_note",
        "requirement_kind": "Constraint",
        "priority": "Mandatory",
        "suggested_discipline": "Строительство",
        "confidence": 0.96,
        "extraction_basis": "callout"
      }}
    ]

    Пример 3 — только схема без текста:
    Если на изображении есть только графическая технологическая схема без читаемых текстовых требований,
    таблиц, легенд или примечаний, правильный ответ:
    []

    Ничего кроме валидного JSON не возвращай.

